<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tiny Think - Hafalan Surat Harian</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Fredoka', sans-serif;
  background:linear-gradient(180deg,#f7fbff,#eef5ff);
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.title{
  text-align:center;
  font-weight:900;
  font-size:26px;
  color:#1c2c6b;
  margin-bottom:20px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.title-icon{
  width:45px;
  height:45px;

  animation:bounce 2s infinite;
}

@keyframes bounce{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }
}

/* LIST */
.surat-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  padding:14px;
  border-radius:18px;
  margin-bottom:12px;
  box-shadow:0 10px 20px rgba(0,0,0,.08);
  cursor:pointer;
}

.surat-left{display:flex;gap:12px;align-items:center;}
.icon{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#eaf7ff;

  display:flex;
  align-items:center;
  justify-content:center;
}

.surat-icon{
  width:35px;
  height:35px;

  transition:.3s;
}

.surat-item:hover .surat-icon{
  transform:scale(1.15) rotate(-8deg);
}
.arab{font-weight:900}
.latin{font-size:13px;color:#6a74a8}

.play{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(90deg,#46b4ff,#62e6b0);
  display:flex;align-items:center;justify-content:center;color:#fff;
}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  display:none;justify-content:center;align-items:center;
}
.modal.show{display:flex}

.modal-card{
  width:95%;
  max-width:700px;
  border-radius:20px;
  padding:20px;
  position:relative;
  z-index:1;

  background-color:rgba(255,255,255,0.95);

  .modal-card::before{
  content:"✨ ⭐ 🌙 ✨";
  position:absolute;
  top:10px;
  left:15px;
  font-size:20px;
  opacity:.5;
}
}

.close{position:absolute;right:10px;top:10px;cursor:pointer}

.modal-title{text-align:center;font-weight:900}

.ayat-no{
  text-align:center;
  margin-top:10px;
  font-weight:800;
  color:#46b4ff;
}

.modal-arab{
  font-size:clamp(24px,4vw,34px);
  text-align:right;
  margin:20px 0;
  direction:rtl;
  line-height:2.2;

  word-break:break-word;

  background:#fff;
  padding:20px;
  border-radius:20px;

  box-shadow:0 5px 15px rgba(0,0,0,.05);

  animation:fadeAyat .6s ease;
}

@keyframes fadeAyat{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.modal-latin{font-style:italic}
.modal-arti{background:#eef5ff;padding:10px;border-radius:10px;margin-top:10px}

/* BUTTON */
.btn{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.next{background:#4dabf7;color:#fff}
.eye{background:#fff;border:1px solid #ccc}

.ayat-symbol{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  margin-left:8px;
  border:2px solid black;
  border-radius:50%;
  font-size:14px;
  font-weight:bold;
  color:black;
  position:relative;
}

.ayat-symbol::before,
.ayat-symbol::after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  background:black;
  border-radius:50%;
}

.ayat-symbol::before{
  top:-3px;
}

.ayat-symbol::after{
  bottom:-3px;
}

.btn-group{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.prev{
  background:#ffb84d;
  color:white;
}

.play-btn{
  background:#7c5cff;
  color:white;

  box-shadow:0 0 15px rgba(124,92,255,.6);

  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
  }
}

.finish-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.finish-popup.show{
  display:flex;
}

.finish-card{
  background:white;
  width:90%;
  max-width:350px;
  border-radius:25px;
  padding:30px 20px;
  text-align:center;

  animation:pop .4s ease;

  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.finish-icon{
  font-size:55px;
  margin-bottom:10px;
}

.finish-card h2{
  color:#4dabf7;
  margin-bottom:10px;
}

.finish-card p{
  color:#555;
  font-size:18px;
  line-height:1.5;
}

.finish-card button{
  margin-top:20px;
  border:none;
  background:linear-gradient(90deg,#46b4ff,#62e6b0);
  color:white;
  padding:12px 20px;
  border-radius:15px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
}

@keyframes pop{
  from{
    transform:scale(.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}
</style>
</head>

<body>

<div class="container">
<div class="title">
  <img src="assets/images/slider/logo quran.png" class="title-icon">
  Hafalan Surat Harian
</div>
<div id="list"></div>
</div>

<div class="modal" id="modal">
<div class="modal-card">

<div class="close" onclick="closeModal()">✖</div>

<div class="modal-title" id="title"></div>
<div class="ayat-no" id="ayatNo"></div>

<div class="modal-arab" id="arab"></div>
<div class="modal-latin" id="latin"></div>
<div class="modal-arti" id="arti"></div>

<div class="btn-group">
  <button class="btn eye" onclick="toggleArti()">👀 Arti</button>
  <button class="btn prev" onclick="prevAyat()">⬅ Back</button>
  <button class="btn next" onclick="nextAyat()">➡ Next</button>
  <button class="btn play-btn" onclick="playAudio()">🔊 Play</button>
</div>
</div>
</div>

let currentSurat=null;
let index=0;
let artiVisible=true;

function render(){
const list=document.getElementById("list");
list.innerHTML="";
suratData.forEach((s,i)=>{
const item=document.createElement("div");
item.className="surat-item";
item.innerHTML=`
<div class="surat-left">
<div class="icon">
  <img src="assets/images/slider/logo quran.png" class="surat-icon">
</div>
<div>
<div class="arab">${s.arabTitle}</div>
<div class="latin">${s.judul}</div>
</div>
</div>
<div class="play">▶</div>`;
item.onclick=()=>openModal(i);
list.appendChild(item);
});
}

function openModal(i){
currentSurat=suratData[i];
index=0;
update();
document.getElementById("modal").classList.add("show");
}

function closeModal(){
document.getElementById("modal").classList.remove("show");
}

function update(){
const ayat=currentSurat.ayat[index];

document.getElementById("title").innerHTML=
currentSurat.arabTitle+"<br><small>"+currentSurat.judul+"</small>";

document.getElementById("ayatNo").innerText="Ayat "+ayat.no;
  document.getElementById("arab").innerHTML =
  ayat.arab + " <span dir='ltr' class='ayat-symbol'>" + toArabicNumber(ayat.no) + "</span>";
  document.getElementById("latin").innerText=ayat.latin;
  document.getElementById("arti").innerText=ayat.arti;
}

function nextAyat(){

if(index < currentSurat.ayat.length - 1){

  index++;
  update();

}else{

  document.getElementById("finishPopup")
  .classList.add("show");

  document.getElementById("finishText")
  .innerText =
  "Horeee kamu telah menyelesaikan surat " +
  currentSurat.judul + " 🎉🌈";

}
}

function prevAyat(){
if(index > 0){
index--;
update();
}else{
alert("Ini ayat pertama 😊");
}
}

function toggleArti(){
artiVisible=!artiVisible;
document.getElementById("arti").style.display=artiVisible?"block":"none";
}

function toArabicNumber(num){
  const arabicNums = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return num.toString().split('').map(d => arabicNums[d]).join('');
}

function closeFinishPopup(){
  document.getElementById("finishPopup")
  .classList.remove("show");
}
render();
render();
</script>

<div class="finish-popup" id="finishPopup">
  <div class="finish-card">
    
    <div class="finish-icon">✅😊</div>

    <h2>Horeee 🎉</h2>

    <p id="finishText">
      Kamu berhasil menyelesaikan surat
    </p>

    <button onclick="closeFinishPopup()">
      Alhamdulillah 🤍
    </button>

  </div>
</div>
</body>
</html>
